name: Release
on:
  push:
    tags: ["v*"]

# Read-only by default; only the job that publishes gets write access.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc (not musl): the GPU benchmark dlopens the system Vulkan driver,
          # which a static musl binary cannot do. zigbuild pins glibc 2.28 for old distros.
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  asset: hwbench-linux-x86_64,  glibc: "2.28" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: hwbench-linux-aarch64, glibc: "2.28" }
          - { runner: macos-latest,     target: aarch64-apple-darwin,       asset: hwbench-macos-aarch64 }
          - { runner: macos-latest,     target: x86_64-apple-darwin,        asset: hwbench-macos-x86_64 }
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc,     asset: hwbench-windows-x86_64.exe }
          - { runner: windows-11-arm,   target: aarch64-pc-windows-msvc,    asset: hwbench-windows-aarch64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Cached per target, so re-running a failed release job doesn't start from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: matrix.glibc
        run: pip install ziglang==0.13.0
      # Prebuilt binary instead of compiling cargo-zigbuild from source on every release.
      - if: matrix.glibc
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild
      - if: matrix.glibc
        run: cargo zigbuild --release --locked -p hwbench --target ${{ matrix.target }}.${{ matrix.glibc }}
      - if: ${{ !matrix.glibc }}
        run: cargo build --release --locked -p hwbench --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/hwbench
          [[ "${{ matrix.target }}" == *windows* ]] && src="$src.exe"
          mkdir -p dist && cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p hwbench-kernels-wasm --target wasm32-unknown-unknown --profile wasm
      - run: mkdir -p dist && cp target/wasm32-unknown-unknown/wasm/hwbench_kernels_wasm.wasm dist/hwbench-kernels.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hwbench-kernels.wasm
          path: dist/hwbench-kernels.wasm

  release:
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Signed build provenance for every binary and the verifier: hwbench's `pnpm agent:pin`
      # refuses a release whose files weren't built by this workflow from this repository.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hwbench-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
