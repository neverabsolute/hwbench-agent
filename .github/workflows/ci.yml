name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # Dependencies (wgpu and friends) are cached between runs, per OS.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Golden digests must match on every OS/arch — this is what makes
      # server-side verification of native results possible. One build covers both crates'
      # tests (payload key names match the protocol); the `ci` profile skips the slow LTO link.
      - run: cargo test --profile ci -p hwbench-kernels -p hwbench -p hwbench-verify
      - run: cargo build -p hwbench-kernels-wasm --target wasm32-unknown-unknown --profile wasm
      - run: cargo run --profile ci -p hwbench -- --list-gpus
      # macOS runners have an Apple GPU (Metal); Windows has WARP (DX12 software).
      # Linux runners have no GPU: the suite must skip cleanly there.
      - run: cargo run --profile ci -p hwbench -- --dry-run --no-open --all
      # Shows what hardware details each OS reports (memory modules, board, caches).
      - run: cargo run --profile ci -p hwbench -- --dry-run --json --no-open --ram
