[workspace]
resolver = "3"
members = ["crates/kernels", "crates/kernels-wasm", "crates/agent"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/neverabsolute/hwbench-agent"

[workspace.dependencies]
hwbench-kernels = { path = "crates/kernels" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm]
inherits = "release"
opt-level = "s"
