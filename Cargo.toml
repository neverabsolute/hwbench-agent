[workspace]
resolver = "3"
members = ["crates/kernels", "crates/kernels-wasm", "crates/agent"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/neverabsolute/hwbench-agent"

[workspace.dependencies]
hwbench-kernels = { path = "crates/kernels" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# CI: release-level optimization without the slow fat-LTO, single-codegen-unit link. Kernel
# results don't depend on these settings (integer and IEEE float operations only), so the
# golden-digest checks still hold for release builds.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.wasm]
inherits = "release"
opt-level = "s"
